services:
  proxy:
    image: caddy:2-alpine
    container_name: euroatlas-production-proxy
    restart: unless-stopped

    environment:
      DOMAIN: ${DOMAIN:?DOMAIN is required}
      ACME_EMAIL: ${ACME_EMAIL:?ACME_EMAIL is required}

    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"

    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

    depends_on:
      api:
        condition: service_healthy

      web:
        condition: service_healthy

    networks:
      - euroatlas


volumes:
  caddy_data:
    name: euroatlas-production-caddy-data

  caddy_config:
    name: euroatlas-production-caddy-config
