name: GitHub Release

on:
  push:
    tags:
      - "v*.*.*"

  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag to publish
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18

        env:
          POSTGRES_USER: euroatlas
          POSTGRES_PASSWORD: euroatlas_password
          POSTGRES_DB: euroatlas_cargo_test

        ports:
          - 5432:5432

        options: >-
          --health-cmd
          "pg_isready -U euroatlas -d euroatlas_cargo_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: >-
        postgresql://euroatlas:euroatlas_password@localhost:5432/euroatlas_cargo_test?schema=public

      NODE_ENV: test

      RELEASE_TAG: >-
        ${{ inputs.release_tag || github.ref_name }}

    steps:
      - name: Checkout tagged commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ env.RELEASE_TAG }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.19.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --dir apps/api exec prisma generate

      - name: Verify database target
        shell: bash
        run: |
          node <<'NODE'
          const raw = process.env.DATABASE_URL;

          if (!raw) {
            throw new Error(
              'DATABASE_URL is missing.',
            );
          }

          const url = new URL(raw);

          const database =
            decodeURIComponent(
              url.pathname.replace(/^\/+/, ''),
            );

          if (
            database !==
            'euroatlas_cargo_test'
          ) {
            throw new Error(
              `Unsafe CI database: ${database}`,
            );
          }

          console.log(
            'Safe CI database:',
            database,
          );
          NODE

      - name: Validate release tag
        run: |
          pnpm release:tag:check -- \
            "${RELEASE_TAG}"

      - name: Run release verification
        run: pnpm release:check

      - name: Build release bundle
        run: pnpm release:bundle

      - name: Verify release checksum
        run: |
          CHECKSUM_FILE="$(
            find artifacts/release \
              -maxdepth 1 \
              -type f \
              -name 'euroatlas-cargo-*.tar.gz.sha256' \
              -print \
              | sort \
              | tail -1
          )"

          test -n "$CHECKSUM_FILE"

          cd artifacts/release

          shasum -a 256 \
            -c \
            "$(basename "$CHECKSUM_FILE")"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: EuroAtlas Cargo ${{ env.RELEASE_TAG }}
          generate_release_notes: true
          files: |
            artifacts/release/euroatlas-cargo-*.tar.gz
            artifacts/release/euroatlas-cargo-*.tar.gz.sha256
            artifacts/release/release-manifest.json
